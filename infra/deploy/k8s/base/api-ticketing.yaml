apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ticketing
  namespace: venuepulse
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-ticketing }
  template:
    metadata:
      labels: { app: api-ticketing }
    spec:
      containers:
        - name: api-ticketing
          image: ghcr.io/OWNER/venuepulse-api-ticketing:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__TicketingDb
              valueFrom: { secretKeyRef: { name: venuepulse-db-secrets, key: ticketing-connection-string } }
            - name: Observability__OtlpEndpoint
              value: "http://seq.observability:80/ingest/otlp/v1/traces"
            - name: Observability__SeqServerUrl
              value: "http://seq.observability:80"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-ticketing
  namespace: venuepulse
spec:
  selector: { app: api-ticketing }
  ports:
    - port: 8080
      targetPort: 8080
