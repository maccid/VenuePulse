apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  namespace: venuepulse
spec:
  replicas: 2
  selector: { matchLabels: { app: shell } }
  template:
    metadata: { labels: { app: shell } }
    spec:
      containers:
        - name: shell
          image: ghcr.io/OWNER/venuepulse-shell:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: shell, namespace: venuepulse }
spec:
  selector: { app: shell }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
