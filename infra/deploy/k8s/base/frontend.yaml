apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-shell
  namespace: venuepulse
spec:
  replicas: 2
  selector: { matchLabels: { app: web-shell } }
  template:
    metadata: { labels: { app: web-shell } }
    spec:
      containers:
        - name: web-shell
          image: ghcr.io/OWNER/venuepulse-web-shell:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web-shell, namespace: venuepulse }
spec:
  selector: { app: web-shell }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ticket-checkout
