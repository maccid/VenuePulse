apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-checkin
  namespace: venuepulse
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-checkin }
  template:
    metadata:
      labels: { app: api-checkin }
    spec:
      containers:
        - name: api-checkin
          image: ghcr.io/OWNER/venuepulse-api-checkin:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__CheckInDb
              valueFrom: { secretKeyRef: { name: venuepulse-db-secrets, key: checkin-connection-string } }
            - name: RabbitMq__ConnectionString
              valueFrom: { secretKeyRef: { name: venuepulse-broker-secrets, key: rabbitmq-connection-string } }
            - name: Mongo__ConnectionString
              valueFrom: { secretKeyRef: { name: venuepulse-broker-secrets, key: mongo-connection-string } }
            - name: Observability__OtlpEndpoint
              value: "http://jaeger-collector.observability:4317"
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "750m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-checkin
  namespace: venuepulse
spec:
  selector: { app: api-checkin }
  ports:
    - port: 8080
      targetPort: 8080
