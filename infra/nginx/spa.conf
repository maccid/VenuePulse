server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ticket-checkout.js/css llevan nombre fijo sin hash de contenido (ver vite.config.ts), así que
    # un navegador puede quedarse con copias viejas tras un deploy (p. ej. gradas del plano en negro
    # al mezclar JS nuevo con CSS viejo). no-cache = cachear pero revalidar siempre con ETag.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
