worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Composición de micro frontends por rutas (ver ADR 0004): cada app es un contenedor
    # independiente con su propio Nginx sirviendo sus estáticos; este Nginx solo compone y
    # hace de reverse proxy hacia esos contenedores y hacia los 3 backends.
    #
    # Los destinos se guardan en variables ($upstream_*) en vez de bloques "upstream" con
    # "server host:port" fijo: ese formato resuelve el hostname UNA sola vez, al arrancar
    # nginx, y cachea la IP para siempre. Si luego se recrea (rebuild/restart) solo alguno
    # de los contenedores de destino sin recrear también este gateway, Docker puede
    # reasignarle la IP que antes tenía OTRO contenedor, y el gateway sigue enviando tráfico
    # a esa IP vieja -> cruza servicios sin dar ningún error (bug real detectado: /venue-ops/
    # servía ticket-checkout y viceversa). Usar una variable en proxy_pass fuerza a nginx a
    # resolver el hostname en cada petición a través del DNS embebido de Docker.
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # "set" se evalúa en cada petición (a diferencia de "upstream"), así que cada proxy_pass
        # de abajo re-resuelve el hostname a través del resolver de Docker en vez de reusar una
        # IP cacheada del arranque de nginx.
        set $shell_upstream           http://web-shell:80;
        set $ticket_checkout_upstream http://web-ticket-checkout:80;
        set $venue_ops_upstream       http://web-venue-ops:80;
        set $ticketing_upstream       http://api-ticketing:8080;
        set $access_control_upstream  http://api-accesscontrol:8080;
        set $checkin_upstream         http://api-checkin:8080;

        # Con variable en proxy_pass, nginx ya no recorta el prefijo de la location por sí solo
        # (esa magia solo aplica con un destino "server host:port" estático) — hay que quitarlo
        # a mano con rewrite, igual que ya se hace abajo para las rutas /api/*.
        location /ticket-checkout/ {
            rewrite ^/ticket-checkout/(.*)$ /$1 break;
            proxy_pass $ticket_checkout_upstream;
        }

        location /venue-ops/ {
            rewrite ^/venue-ops/(.*)$ /$1 break;
            proxy_pass $venue_ops_upstream;
        }

        # El frontend ya llama incluyendo su propio "/api/..." (p.ej. fetch('/api/ticketing/api/events')):
        # este rewrite solo retira el prefijo de ruteo (/api/ticketing) y reenvía el resto tal cual,
        # sin anteponer otro "/api/" (bug: generaba "/api/api/events" duplicado contra el backend real).
        location /api/ticketing/ {
            rewrite ^/api/ticketing(/.*)$ $1 break;
            proxy_pass $ticketing_upstream;
        }

        location /api/access-control/ {
            rewrite ^/api/access-control(/.*)$ $1 break;
            proxy_pass $access_control_upstream;
        }

        location /api/checkin/ {
            rewrite ^/api/checkin(/.*)$ $1 break;
            proxy_pass $checkin_upstream;
        }

        location /hubs/occupancy {
            proxy_pass $access_control_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /hubs/tickets {
            proxy_pass $checkin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /hubs/pricing {
            proxy_pass $ticketing_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass $shell_upstream;
        }
    }
}
