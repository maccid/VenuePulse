worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Composición de micro frontends por rutas (ver ADR 0004): cada app es un contenedor
    # independiente con su propio Nginx sirviendo sus estáticos; este Nginx solo compone y
    # hace de reverse proxy hacia esos contenedores y hacia los 3 backends.
    upstream shell_app { server web-shell:80; }
    upstream ticket_checkout_app { server web-ticket-checkout:80; }
    upstream venue_ops_app { server web-venue-ops:80; }
    upstream ticketing_api { server api-ticketing:8080; }
    upstream access_control_api { server api-accesscontrol:8080; }
    upstream checkin_api { server api-checkin:8080; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /ticket-checkout/ {
            proxy_pass http://ticket_checkout_app/;
        }

        location /venue-ops/ {
            proxy_pass http://venue_ops_app/;
        }

        location /api/ticketing/ {
            rewrite ^/api/ticketing/(.*)$ /api/$1 break;
            proxy_pass http://ticketing_api;
        }

        location /api/access-control/ {
            rewrite ^/api/access-control/(.*)$ /api/$1 break;
            proxy_pass http://access_control_api;
        }

        location /api/checkin/ {
            rewrite ^/api/checkin/(.*)$ /api/$1 break;
            proxy_pass http://checkin_api;
        }

        location /hubs/occupancy {
            proxy_pass http://access_control_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /hubs/tickets {
            proxy_pass http://checkin_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://shell_app;
        }
    }
}
