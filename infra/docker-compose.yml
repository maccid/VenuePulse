name: venuepulse

# Contexto de build relativo a este fichero (infra/docker-compose.yml): ".." es la raíz del
# repo — mantiene infra/ separado de src/ (backend) y frontend/ (ver README de estructura).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venuepulse
      POSTGRES_PASSWORD: venuepulse
      POSTGRES_MULTIPLE_DATABASES: venuepulse_ticketing,venuepulse_accesscontrol,venuepulse_checkin
    volumes:
      - ./deploy/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venuepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10

  # Trazas distribuidas end-to-end (ver ADR 0006 / sección "Observabilidad" del README):
  # abrir http://localhost:16686 tras una compra para ver el trace completo cruzando los 3 servicios.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  ticketing-api:
    build:
      context: ..
      dockerfile: src/Services/Ticketing/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__TicketingDb: "Host=postgres;Port=5432;Database=venuepulse_ticketing;Username=venuepulse;Password=venuepulse"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy

  accesscontrol-api:
    build:
      context: ..
      dockerfile: src/Services/AccessControl/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__AccessControlDb: "Host=postgres;Port=5432;Database=venuepulse_accesscontrol;Username=venuepulse;Password=venuepulse"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  checkin-api:
    build:
      context: ..
      dockerfile: src/Services/CheckIn/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__CheckInDb: "Host=postgres;Port=5432;Database=venuepulse_checkin;Username=venuepulse;Password=venuepulse"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__SagaDatabase: "venuepulse_sagas"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://jaeger:4317"
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy

  shell:
    build:
      context: ..
      dockerfile: frontend/apps/shell/Dockerfile
    expose:
      - "80"

  ticket-checkout:
    build:
      context: ..
      dockerfile: frontend/apps/ticket-checkout/Dockerfile
    expose:
      - "80"

  venue-ops:
    build:
      context: ..
      dockerfile: frontend/apps/venue-ops/Dockerfile
    expose:
      - "80"

  # Único punto de entrada del navegador: compone las 3 apps React y hace de reverse proxy
  # hacia los 3 backends + los hubs de SignalR (ver ADR 0004 sobre micro frontends).
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - shell
      - ticket-checkout
      - venue-ops
      - ticketing-api
      - accesscontrol-api
      - checkin-api

volumes:
  postgres-data:
  mongo-data:
