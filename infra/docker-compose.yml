name: venuepulse

# Contexto de build relativo a este fichero (infra/docker-compose.yml): ".." es la raíz del
# repo — mantiene infra/ separado de services/ (backend) y ui/ (frontend) (ver README de estructura).
#
# Nomenclatura de servicios (para que `docker ps` / Docker Desktop agrupe visualmente por tipo):
#   sin prefijo -> infraestructura de terceros (postgres, mongo, rabbitmq, zookeeper, clickhouse, signoz)
#   api-*       -> backends propios (.NET)
#   web-*       -> frontends propios (React)
#   gateway     -> único punto de entrada del navegador
#
# Rebuild selectivo: `docker compose up --build` solo reconstruye las imágenes cuyo contexto
# cambió (cache por capas) — no hace falta perfiles para eso.
services:

  # ---------------------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: venuepulse-postgres
    environment:
      POSTGRES_USER: venuepulse
      POSTGRES_PASSWORD: venuepulse
      POSTGRES_MULTIPLE_DATABASES: venuepulse_ticketing,venuepulse_accesscontrol,venuepulse_checkin
    volumes:
      - ./deploy/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venuepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: venuepulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: venuepulse-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10

  # Observabilidad unificada (trazas + logs en una sola UI) con SigNoz + ClickHouse — sustituye
  # a Jaeger (ver ADR 0031). Los servicios exportan trazas Y logs por OTLP al collector
  # (4317 gRPC / 4318 HTTP) y SigNoz correlaciona cada log con su trace por trace_id/span_id.
  # Tras una compra, abrir http://localhost:3301 (SigNoz) para ver el trace completo y sus logs.
  # Primer arranque: tarda ~1 min en inicializar (ClickHouse + migraciones + histogram-binary).
  # Stack mínimo de SigNoz (sin keeper — ver ADR 0031): zookeeper (metadata de réplicas),
  # clickhouse (almacenamiento), signoz (UI+API), signoz-otel-collector (ingesta OTLP) y 2 jobs
  # one-shot (init-clickhouse, migraciones del telemetry store).
  zookeeper-1:
    image: signoz/zookeeper:3.7.1
    container_name: venuepulse-signoz-zookeeper
    user: root
    restart: unless-stopped
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    healthcheck:
      # ruok sobre el admin server HTTP de ZK (8080) devuelve {"command":"ruok","error":null,...}
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3

  init-clickhouse:
    # Job one-shot: descarga el UDF histogramQuantile que SigNoz usa para percentiles en métricas.
    image: clickhouse/clickhouse-server:25.5.6
    container_name: venuepulse-signoz-init-clickhouse
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - ./signoz/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: venuepulse-signoz-clickhouse
    tty: true
    restart: unless-stopped
    depends_on:
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ./signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./signoz/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
      - clickhouse-data:/var/lib/clickhouse/

  signoz-telemetrystore-migrator:
    # Job one-shot: crea/actualiza el esquema de ClickHouse (bootstrap + sync + async).
    image: signoz/signoz-otel-collector:v0.144.2
    container_name: venuepulse-signoz-migrator
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up

  signoz:
    image: signoz/signoz:v0.119.0
    container_name: venuepulse-signoz
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      # Host 8080 lo usa el gateway (nginx): SigNoz queda en 3301, y su API vive en el mismo 8080 interno.
      - "3301:8080"
    volumes:
      - signoz-data:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=secret
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.144.2
    container_name: venuepulse-signoz-collector
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "4317:4317" # OTLP gRPC (traces + logs de los 3 servicios)
      - "4318:4318" # OTLP HTTP

  # ---------------------------------------------------------------------------------------
  # Backends (.NET)
  # ---------------------------------------------------------------------------------------
  api-ticketing:
    container_name: venuepulse-api-ticketing
    build:
      context: ..
      dockerfile: services/Ticketing/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__TicketingDb: "Host=postgres;Port=5432;Database=venuepulse_ticketing;Username=venuepulse;Password=venuepulse"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://signoz-otel-collector:4317"
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Publica EventCreated al sembrar — necesita que el consumer de AccessControl ya esté
      # enlazado a su cola antes de arrancar, o el mensaje se pierde (ver .ia/KNOWN-ISSUES.md).
      # api-accesscontrol healthy implica que su MassTransit ya completó el bind de colas,
      # porque /health solo responde una vez que todos los IHostedService (incl. el bus) arrancaron.
      api-accesscontrol:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-accesscontrol:
    container_name: venuepulse-api-accesscontrol
    build:
      context: ..
      dockerfile: services/AccessControl/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__AccessControlDb: "Host=postgres;Port=5432;Database=venuepulse_accesscontrol;Username=venuepulse;Password=venuepulse"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://signoz-otel-collector:4317"
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-checkin:
    container_name: venuepulse-api-checkin
    build:
      context: ..
      dockerfile: services/CheckIn/Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__CheckInDb: "Host=postgres;Port=5432;Database=venuepulse_checkin;Username=venuepulse;Password=venuepulse"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__SagaDatabase: "venuepulse_sagas"
      # Única llamada HTTP síncrona entre dos backends del proyecto (ver ADR 0028, decisión 2):
      # PlaceOrderCommand valida el precio de cada línea contra Ticketing antes de reservar nada.
      Ticketing__BaseUrl: "http://api-ticketing:8080"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Observability__OtlpEndpoint: "http://signoz-otel-collector:4317"
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      # Nuevo (ADR 0028): a diferencia del resto de dependencias entre servicios (siempre por
      # bus), PlaceOrderCommand necesita a Ticketing respondiendo YA por HTTP para poder crear un
      # pedido — sin esto, la primera petición tras un arranque en frío puede fallar con
      # "PricingUnavailable" mientras Ticketing todavía no atiende peticiones.
      api-ticketing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------------------
  # Frontends (React) — nombre de carpeta real en ui/<app>, sin el prefijo web-
  # ---------------------------------------------------------------------------------------
  web-shell:
    container_name: venuepulse-web-shell
    build:
      context: ..
      dockerfile: ui/shell/Dockerfile
    expose:
      - "80"

  web-ticket-checkout:
    container_name: venuepulse-web-ticket-checkout
    build:
      context: ..
      dockerfile: ui/ticket-checkout/Dockerfile
    expose:
      - "80"

  web-venue-ops:
    container_name: venuepulse-web-venue-ops
    build:
      context: ..
      dockerfile: ui/venue-ops/Dockerfile
    expose:
      - "80"

  # ---------------------------------------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------------------------------------
  # Único punto de entrada del navegador: compone las 3 apps React y hace de reverse proxy
  # hacia los 3 backends + los hubs de SignalR (ver ADR 0004 sobre micro frontends).
  gateway:
    container_name: venuepulse-gateway
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web-shell
      - web-ticket-checkout
      - web-venue-ops
      - api-ticketing
      - api-accesscontrol
      - api-checkin

volumes:
  postgres-data:
  mongo-data:
  zookeeper-data:
  clickhouse-data:
  signoz-data:
