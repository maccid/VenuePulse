version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/services"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ui/shell"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ui/ticket-checkout"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ui/venue-ops"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
