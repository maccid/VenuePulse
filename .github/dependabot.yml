version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend/apps/shell"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend/apps/ticket-checkout"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend/apps/venue-ops"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
