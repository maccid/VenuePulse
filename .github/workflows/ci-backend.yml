name: CI Backend

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["src/**", ".github/workflows/ci-backend.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore src/VenuePulse.slnx

      - name: Compilar
        run: dotnet build src/VenuePulse.slnx --no-restore -c Release

      # Los runners de ubuntu-latest tienen Docker disponible: los tests de integración con
      # Testcontainers (Postgres+RabbitMQ+MongoDB reales) corren aquí sin infraestructura extra.
      - name: Tests unitarios, de arquitectura e integración
        run: dotnet test src/VenuePulse.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Publicar resultados de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
