name: CI Backend

on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["services/**", ".github/workflows/ci-backend.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore services/VenuePulse.slnx

      - name: Compilar
        run: dotnet build services/VenuePulse.slnx --no-restore -c Release

      # Los runners de ubuntu-latest tienen Docker disponible, pero los tests de integración con
      # Testcontainers (Postgres+RabbitMQ+MongoDB reales) son flaky en CI por contención de
      # recursos del arnés (ver ADR 0009 y .ia/KNOWN-ISSUES.md): se ejecutan solo localmente
      # bajo demanda. Aquí corren los unitarios y de arquitectura.
      - name: Tests unitarios, de arquitectura e integración
        run: dotnet test services/VenuePulse.slnx --no-build -c Release --filter "FullyQualifiedName!~IntegrationTests" --logger "trx" --results-directory TestResults

      - name: Publicar resultados de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
