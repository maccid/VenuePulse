name: Docker Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api-ticketing
            dockerfile: src/Services/Ticketing/Api/Dockerfile
            context: .
          - name: api-accesscontrol
            dockerfile: src/Services/AccessControl/Api/Dockerfile
            context: .
          - name: api-checkin
            dockerfile: src/Services/CheckIn/Api/Dockerfile
            context: .
          - name: web-shell
            dockerfile: frontend/apps/shell/Dockerfile
            context: .
          - name: web-ticket-checkout
            dockerfile: frontend/apps/ticket-checkout/Dockerfile
            context: .
          - name: web-venue-ops
            dockerfile: frontend/apps/venue-ops/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f ${{ matrix.dockerfile }} -t venuepulse-${{ matrix.name }}:ci ${{ matrix.context }}

      # Convierte la garantía de "ADR 0007 (.ia nunca en Docker)" en una aserción verificada en
      # cada push, no en una promesa: falla el pipeline si algo con ese nombre aparece en la imagen.
      - name: "Guard: .ia nunca debe estar en la imagen"
        run: |
          docker save venuepulse-${{ matrix.name }}:ci | tar -tv | grep -i '\.ia' && exit 1 || echo "OK: .ia no encontrado en la imagen"

      - name: Login a GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag venuepulse-${{ matrix.name }}:ci ghcr.io/${{ github.repository_owner }}/venuepulse-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/venuepulse-${{ matrix.name }}:latest

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifiestos K8s (sintaxis, sin desplegar — ver infra/deploy/README)
        uses: azure/setup-kubectl@v4
      - run: kubectl apply --dry-run=client -f infra/deploy/k8s/base/
