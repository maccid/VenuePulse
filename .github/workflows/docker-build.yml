name: Docker Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api-ticketing
            dockerfile: services/Ticketing/Api/Dockerfile
            context: .
          - name: api-accesscontrol
            dockerfile: services/AccessControl/Api/Dockerfile
            context: .
          - name: api-checkin
            dockerfile: services/CheckIn/Api/Dockerfile
            context: .
          - name: web-shell
            dockerfile: ui/venue-shell/Dockerfile
            context: .
          - name: web-ticket-checkout
            dockerfile: ui/venue-ticket/Dockerfile
            context: .
          - name: web-venue-ops
            dockerfile: ui/venue-ops/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f ${{ matrix.dockerfile }} -t venuepulse-${{ matrix.name }}:ci ${{ matrix.context }}

      # Verifica que la imagen no incluye ficheros de desarrollo local que no deben empaquetarse.
      - name: "Guard: sin ficheros de desarrollo local en la imagen"
        run: |
          docker save venuepulse-${{ matrix.name }}:ci | tar -tv | grep -i '\.ia' && exit 1 || echo "OK"

      - name: Login a GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag venuepulse-${{ matrix.name }}:ci ghcr.io/${{ github.repository_owner }}/venuepulse-${{ matrix.name }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/venuepulse-${{ matrix.name }}:latest

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifiestos K8s (sintaxis, sin desplegar — ver infra/deploy/README)
        uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infra/deploy/k8s/base/ >/dev/null
